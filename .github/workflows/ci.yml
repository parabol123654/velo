name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check # build, vet, gofmt, Go and web tests
      - name: Build leaves the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed tracked files:"; git status --porcelain; exit 1
          fi
      - name: Agent and skill frontmatter
        run: |
          status=0
          checked=0
          for f in .claude/agents/*.md .claude/skills/*/SKILL.md; do
            [ -e "$f" ] || continue
            checked=$((checked + 1))
            if [ "$(head -n 1 "$f")" != "---" ]; then
              echo "$f: must start with ---"; status=1; continue
            fi
            if [ "$(grep -c '^---$' "$f")" -lt 2 ]; then
              echo "$f: frontmatter has no closing ---"; status=1; continue
            fi
            front="$(awk 'NR == 1 { next } /^---$/ { exit } { print }' "$f")"
            for key in name description; do
              if ! printf '%s\n' "$front" | grep -q "^$key:"; then
                echo "$f: frontmatter has no '$key:'"; status=1
              fi
            done
          done
          if [ "$checked" -eq 0 ]; then
            echo "no agent or skill files found; did .claude/ move?"; status=1
          fi
          exit $status

  # The race detector needs cgo. Release binaries are still built with CGO_ENABLED=0.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make race

  # Rules from CONTRIBUTING.md that a script can check.
  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Commit messages follow 'type: summary'"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad="$(git log --no-merges --format=%s "$BASE..$HEAD" \
            | grep -Ev '^(feat|fix|docs|test|chore|style|ci)(\([a-z0-9-]+\))?: .+' || true)"
          if [ -n "$bad" ]; then
            echo "These commits do not follow 'type: summary' (see CONTRIBUTING.md):"
            echo "$bad"; exit 1
          fi
      - name: New dependencies come with a reason
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff --quiet "$BASE" "$HEAD" -- go.mod web/package.json && exit 0
          # The text under "## Dependencies", without HTML comments and blank lines.
          reason="$(printf '%s\n' "$BODY" | perl -0pe 's/<!--.*?-->//gs' \
            | awk '/^## /{f = ($0 ~ /^## Dependencies/); next} f' | grep -v '^[[:space:]]*$' || true)"
          if [ -z "$reason" ]; then
            echo "go.mod or web/package.json changed: say under '## Dependencies' in the PR description"
            echo "what was added or bumped, and why existing code is not enough."; exit 1
          fi
